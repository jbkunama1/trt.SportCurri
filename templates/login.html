{% extends "base.html" %}
{% block content %}
<div class="hero">
  <div class="hero-emoji">🏅🏸⚽🏀🤸🏊</div>
  <h1>Sport-Manager</h1>
  <p class="lead">Schulcurriculum Sport • Realschule BW • BP 2016</p>
</div>

<form method="post" class="card login-card">
  <h2>🔑 Anmelden</h2>
  {% if err %}<div class="error">{{ err }}</div>{% endif %}
  <label>👤 Benutzername
    <input type="text" name="username" required autocomplete="username" placeholder="z. B. admin">
  </label>
  <label>🔒 Passwort
    <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
  </label>
  <button class="btn btn-primary" type="submit">Los geht's 🚀</button>
  <p class="muted">Erststart: <code>admin</code> / <code>sport2026</code> — danach bitte ändern! ⚠️</p>
</form>
{% endblock %}
