services:
  sport-manager:
    build: .
    container_name: sport-manager
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SECRET_KEY=bitte-aendern-langer-zufaelliger-string
      - DATA_DIR=/app/data
    volumes:
      - sport_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sport_data:
